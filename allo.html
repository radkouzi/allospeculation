<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row =>
                    row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                );

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <div class="welcome-screen" id="welcome-screen">
        <h2>Welcome</h2>
        <select id="allocation-type">
            <option value="chrono">Check Allocation for Chrono Burns</option>
            <option value="nft">Check Allocation for NFTs/Points</option>
        </select>
        <input type="number" id="chosen-percentage" placeholder="Enter percentage (e.g., 10)" min="0" max="12">
        <button onclick="startCalculation()">Start</button>
    </div>
    <div class="calculator-container" id="calculator-container">
        <div class="calculator" id="chrono-calculator" style="display: none;">
            <h3>Chrono Burn Calculator</h3>
            <div class="input-group">
                <label for="userChronoBurned">How much $CHRONO did you burn?</label>
                <input type="number" id="userChronoBurned" placeholder="e.g., 1400000" min="0">
            </div>
            <button onclick="calculateChrono()">Calculate</button>
            <div id="result-chrono"></div>
        </div>
        <div class="calculator" id="nft-points-calculator" style="display: none;">
            <h3>NFT/Points Calculator</h3>
            <div class="input-group">
                <label for="pointsHeld">Points Held:</label>
                <input type="number" id="pointsHeld" placeholder="e.g., 0" min="0">
            </div>
            <div class="input-group">
                <label for="totalPointsSupply">Total Points Supply: 
                    <span class="tooltip">ⓘ
                        <span class="tooltiptext">Total Points will get updated every 24 hours</span>
                    </span>
                </label>
                <input type="number" id="totalPointsSupply" value="3795006941.19" readonly>
            </div>
            <div class="input-group">
                <label>Allocation Split:</label>
                <div class="slider-container">
                    <div class="slider-text-container">
                        <span id="nftAllocation">NFT Allocation 50%</span>
                        <span id="pointsAllocation">Points Allocation 50%</span>
                    </div>
                    <input type="range" id="nftSplitPercentage" min="0" max="100" value="50" oninput="updateSliderLabels(); updateSliderTrack()">
                </div>
            </div>
            <div class="input-group">
                <label>NFT Tiers:</label>
                <input type="number" id="explorers" placeholder="Explorers" min="0"><br>
                <input type="number" id="collectors" placeholder="Collectors" min="0"><br>
                <input type="number" id="striders" placeholder="Striders" min="0"><br>
                <input type="number" id="operators" placeholder="Operators" min="0">
            </div>
            <button onclick="calculateNFTPoints()">Calculate</button>
            <div id="result-nft"></div>
        </div>
    </div>
    <script>
        const totalTokenSupply = 1000000000;
        const totalChronoBurned = 13581504;
        const marketCaps = [100000000, 250000000, 500000000, 1000000000, 10000000000, 40000000000];
        let chronoBurnerPercentage = 0;
        let ogPercentage = 0;
        let nftPointsPercentage = 0;

        function startCalculation() {
            const allocationType = document.getElementById('allocation-type').value;
            const chosenPercentage = parseFloat(document.getElementById('chosen-percentage').value) || 0;

            if (chosenPercentage > 12 || chosenPercentage < 0) {
                alert("Please enter a percentage between 0 and 12.");
                return;
            }

            const remainingPercentage = 12 - chosenPercentage;
            chronoBurnerPercentage = remainingPercentage / 2;
            ogPercentage = remainingPercentage / 2;
            if (allocationType === 'chrono') {
                chronoBurnerPercentage = chosenPercentage;
                ogPercentage = 0;
                nftPointsPercentage = 0;
            } else { // nft
                nftPointsPercentage = chosenPercentage;
                chronoBurnerPercentage = 0;
                ogPercentage = 0;
            }

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('calculator-container').style.display = 'grid';
            if (allocationType === 'chrono') {
                document.getElementById('chrono-calculator').style.display = 'block';
            } else {
                document.getElementById('nft-points-calculator').style.display = 'block';
            }
        }

        function updateSliderLabels() {
            const slider = document.getElementById('nftSplitPercentage');
            const nftValue = slider.value;
            const pointsValue = 100 - nftValue;
            document.getElementById('nftAllocation').textContent = `NFT Allocation ${nftValue}%`;
            document.getElementById('pointsAllocation').textContent = `Points Allocation ${pointsValue}%`;
        }

        function updateSliderTrack() {
            const slider = document.getElementById('nftSplitPercentage');
            const value = slider.value;
            slider.style.setProperty('--slider-value', `${value}%`);
        }

        function calculate_allocation(points_held, total_points_supply, og_percentage, chrono_burner_percentage, nft_split_percentage, nft_tiers, user_chrono_burned) {
            const airdrop_percentage = 12;
            const og_supply = totalTokenSupply * (og_percentage / 100);
            const chrono_supply = totalTokenSupply * (chrono_burner_percentage / 100);
            const nft_points_supply = totalTokenSupply * (nftPointsPercentage / 100);

            const chrono_share = user_chrono_burned / totalChronoBurned || 0;
            const your_PORTALS_from_chrono = chrono_supply * chrono_share;

            const nft_airdrop_supply = nft_points_supply * (nft_split_percentage / 100);
            const points_airdrop_supply = nft_points_supply * (1 - nft_split_percentage / 100);

            const points_share = points_held / total_points_supply || 0;
            const your_PORTALS_from_points = points_airdrop_supply * points_share;

            const total_nft_weight = 1 * 10000 + 10 * 4500 + 100 * 425 + 600 * 75;
            const user_nft_weight = 1 * nft_tiers.explorers + 10 * nft_tiers.collectors + 100 * nft_tiers.striders + 600 * nft_tiers.operators;
            const nft_share = user_nft_weight / total_nft_weight || 0;
            const your_PORTALS_from_nfts = nft_airdrop_supply * nft_share;

            const your_PORTALS = your_PORTALS_from_points + your_PORTALS_from_nfts + your_PORTALS_from_chrono;

            const results = [];
            for (let market_cap of marketCaps) {
                const token_price = market_cap / totalTokenSupply;
                const allocation_value = your_PORTALS * token_price;
                results.push({
                    "Market Cap": market_cap,
                    "Token Price": token_price,
                    "Your Allocation Value": allocation_value
                });
            }

            return { your_PORTALS, your_PORTALS_from_points, your_PORTALS_from_nfts, your_PORTALS_from_chrono, results };
        }

        function calculateChrono() {
            const user_chrono_burned = parseFloat(document.getElementById('userChronoBurned').value) || 0;

            const chrono_supply = totalTokenSupply * (chronoBurnerPercentage / 100);
            const chrono_share = user_chrono_burned / totalChronoBurned;
            const your_PORTALS_from_chrono = chrono_supply * chrono_share;

            let output = `
                <strong>Your Allocation from Chrono:</strong> ${your_PORTALS_from_chrono.toLocaleString()} $PORTALS<br><br>
                <strong>Market Cap Analysis:</strong><br>
            `;
            marketCaps.forEach((market_cap, index) => {
                const token_price = market_cap / totalTokenSupply;
                const allocation_value = your_PORTALS_from_chrono * token_price;
                output += `
                    <div class="market-cap-card">
                        <strong>Market Cap: $${market_cap.toLocaleString()}</strong>
                        <span>Token Price: $${token_price.toFixed(2)}</span>
                        <span>Your Allocation Value: $${allocation_value.toLocaleString()}</span>
                    </div>
                `;
            });

            document.getElementById('result-chrono').innerHTML = output;
        }

        function calculateNFTPoints() {
            const points_held = parseFloat(document.getElementById('pointsHeld').value) || 0;
            const total_points_supply = parseFloat(document.getElementById('totalPointsSupply').value) || 3795006941.19;
            const nft_split_percentage = parseFloat(document.getElementById('nftSplitPercentage').value) || 50;
            const nft_tiers = {
                explorers: parseInt(document.getElementById('explorers').value) || 0,
                collectors: parseInt(document.getElementById('collectors').value) || 0,
                striders: parseInt(document.getElementById('striders').value) || 0,
                operators: parseInt(document.getElementById('operators').value) || 0
            };

            const { your_PORTALS, your_PORTALS_from_points, your_PORTALS_from_nfts, your_PORTALS_from_chrono, results } = calculate_allocation(points_held, total_points_supply, ogPercentage, 0, nft_split_percentage, nft_tiers, 0);

            let output = `
                <strong>Your Allocation:</strong> ${your_PORTALS.toLocaleString()} $PORTALS<br>
                - From Points: ${your_PORTALS_from_points.toLocaleString()} $PORTALS<br>
                - From NFTs: ${your_PORTALS_from_nfts.toLocaleString()} $PORTALS<br><br>
                <strong>Market Cap Analysis:</strong><br>
            `;
            marketCaps.forEach((market_cap, index) => {
                const token_price = market_cap / totalTokenSupply;
                const allocation_value = your_PORTALS * token_price;
                output += `
                    <div class="market-cap-card">
                        <strong>Market Cap: $${market_cap.toLocaleString()}</strong>
                        <span>Token Price: $${token_price.toFixed(2)}</span>
                        <span>Your Allocation Value: $${allocation_value.toLocaleString()}</span>
                    </div>
                `;
            });

            document.getElementById('result-nft').innerHTML = output;
        }
    </script>
